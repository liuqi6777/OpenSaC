# Complete local-development configuration. Relative paths resolve from this file.
# API keys are not allowed here; keep them in the environment or repository `.env`.

api:
  host: 127.0.0.1
  port: 8000

storage:
  data_dir: ../.opensac
  broker_socket: ../.opensac/broker.sock

deployment:
  worker_id: ""
  build_commit: ""
  sandbox_image_digest: ""
  backend_revision: ""
  backend_metadata_hash: ""

sessions:
  max_active: 0
  ttl_seconds: 0
  reaper_interval_seconds: 60
  tombstone_ttl_seconds: 86400
  content_cache_bytes: 32000000

backends:
  search:
    provider: local
    base_url: http://127.0.0.1:8081
  document:
    provider: local
    base_url: http://127.0.0.1:8081
  rerank:
    provider: lexical
  llm:
    provider: none
    model: ""
    base_url: null

capabilities:
  search:
    max_queries_per_request: 64
    max_query_chars: 4096
    max_top_k: 600
  content:
    max_sources_per_request: 256
    url_admission: searched_or_public_web
    batch_deadline_seconds: 60
  extraction:
    max_items: 256
    max_instruction_bytes: 16384
    max_schema_bytes: 65536
    max_item_bytes: 65536
    max_total_item_bytes: 2097152
    max_schema_depth: 8
    max_repair_attempts: 1

providers:
  fetch_concurrency: 6
  retry_profile: none
  max_attempts: 3
  attempt_timeout_seconds: 30
  logical_deadline_seconds: 90
  base_backoff_seconds: 0.5
  max_backoff_seconds: 4
  max_total_backoff_seconds: 15
  max_retry_after_seconds: 15
  # Optional per-service overrides for search, document, rerank, and LLM.
  services: {}
  inflight_coalescing: false
  max_inflight_keys: 256
  max_waiters_per_key: 64
  result_cache_ttl_seconds: 0
  result_cache_max_bytes: 128000000

sandbox:
  image: ghcr.io/liuqi6777/opensac-sandbox:0.8.0
  mode: cold
  experimental_persistent_interpreter: false
  warm_idle_seconds: 300
  max_warm_containers: 0
  timeout_seconds: 120
  memory: 512m
  cpus: 1.0
  pids_limit: 64
  max_concurrency: 8

limits:
  max_concurrency: 12
  max_output_bytes: 1000000
  max_context_payload_bytes: 200000
