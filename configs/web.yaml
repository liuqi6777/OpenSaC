# Standard Web-provider profile. Set OPENSAC_API_KEY, OPENSAC_SERPER_API_KEY,
# and OPENSAC_JINA_API_KEY in the environment or repository `.env`.

storage:
  data_dir: ../.opensac
  broker_socket: ../.opensac/broker.sock

backends:
  search:
    provider: serper
  document:
    provider: jina
  rerank:
    provider: lexical

sandbox:
  image: ghcr.io/liuqi6777/opensac-sandbox:0.8.3
  mode: cold
