[project]
name = "opensac-sdk"
version = "0.4.0"
description = "Sandbox client SDK for OpenSAC"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensac_sdk"]
