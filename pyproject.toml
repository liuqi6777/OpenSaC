[project]
name = "opensac"
version = "0.1.0.dev0"
description = "Composable Python research capabilities"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.10,<3", "anyio>=4,<5"]

[project.entry-points."opensac.search"]
serper = "opensac.providers.serper:SerperSearch"
http = "opensac.providers.http:HTTPSearch"

[project.entry-points."opensac.fetch"]
jina = "opensac.providers.jina:JinaFetch"
http = "opensac.providers.http:HTTPFetch"

[project.entry-points."opensac.rerank"]
http = "opensac.providers.http:HTTPRerank"

[project.entry-points."opensac.llm"]
openai = "opensac.providers.openai:OpenAILLM"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensac"]

[dependency-groups]
dev = [
  "pytest>=8.4", "pytest-asyncio>=1.1", "ruff>=0.12", "mypy>=1.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
