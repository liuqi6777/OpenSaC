[project]
name = "opensac"
version = "0.4.0"
description = "Open reference implementation of Search as Code"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "httpx[socks]>=0.28",
    "jsonschema>=4.25",
    "mcp>=1.27,<2",
    "openai>=1.99",
    "opensac-sdk",
    "pydantic-settings>=2.10",
    "typer>=0.16",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]

[project.scripts]
opensac = "opensac.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensac", "sac_agent"]

[tool.uv.sources]
opensac-sdk = { workspace = true }

[tool.uv.workspace]
members = ["packages/opensac-sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
