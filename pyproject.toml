[project]
name = "opensac"
dynamic = ["version"]
description = "Open reference implementation of Search as Code"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116",
    "httpx[socks]>=0.28",
    "pydantic-settings>=2.10",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.16",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
agent = [
    "openai>=1.99",
]
dev = [
    "jsonschema>=4.25",
    "mcp>=1.27,<2",
    "mypy>=1.17",
    "openai>=1.99",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]
full = [
    "jsonschema>=4.25",
    "mcp>=1.27,<2",
    "openai>=1.99",
]
llm = [
    "jsonschema>=4.25",
    "openai>=1.99",
]
mcp = [
    "mcp>=1.27,<2",
]

[project.scripts]
opensac = "opensac.cli:app"

[project.urls]
Homepage = "https://github.com/liuqi6777/OpenSaC"
Documentation = "https://github.com/liuqi6777/OpenSaC/tree/main/docs"
Issues = "https://github.com/liuqi6777/OpenSaC/issues"
Repository = "https://github.com/liuqi6777/OpenSaC"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensac", "sac_agent"]

[tool.hatch.build.targets.wheel.force-include]
"dashboard" = "opensac/_dashboard_assets"

[tool.hatch.version]
path = "src/opensac/_version.py"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/opensac/_version.py" },
]

[tool.uv.workspace]
members = ["packages/opensac-sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
