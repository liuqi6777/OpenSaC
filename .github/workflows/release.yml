name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      contract: ${{ steps.metadata.outputs.contract }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Validate tag and release metadata
        id: metadata
        run: |
          uv run python scripts/release.py --tag "${GITHUB_REF_NAME}"
          echo "version=$(uv run python scripts/release.py --field version)" >> "${GITHUB_OUTPUT}"
          echo "contract=$(uv run python scripts/release.py --field contract)" >> "${GITHUB_OUTPUT}"

  publish-sandbox:
    name: Publish sandbox image
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: image
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/opensac-sandbox
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=contract-${{ needs.metadata.outputs.contract }}
            type=sha
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=OpenSAC sandbox
            org.opencontainers.image.description=Hardened execution sandbox for OpenSAC generated programs

      - name: Build and push image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            OPENSAC_SANDBOX_CONTRACT=${{ needs.metadata.outputs.contract }}
            OPENSAC_VERSION=${{ needs.metadata.outputs.version }}
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,mode=max,scope=sandbox
          push: true
          sbom: true
          provenance: mode=max

      - name: Verify published image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/opensac-sandbox:${{ needs.metadata.outputs.version }}
          EXPECTED_CONTRACT: ${{ needs.metadata.outputs.contract }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker pull "${IMAGE}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opensac.sandbox.contract" }}' "${IMAGE}")" = "${EXPECTED_CONTRACT}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${IMAGE}")" = "${EXPECTED_VERSION}"
          docker run --rm --entrypoint python "${IMAGE}" -I -c "import opensac_sdk; assert opensac_sdk.__version__ == '${EXPECTED_VERSION}'"

  publish-service:
    name: Publish service image
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: image
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/opensac
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=OpenSAC
            org.opencontainers.image.description=OpenSAC API and capability broker

      - name: Build and push image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            OPENSAC_VERSION=${{ needs.metadata.outputs.version }}
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha,scope=service
          cache-to: type=gha,mode=max,scope=service
          push: true
          sbom: true
          provenance: mode=max

      - name: Verify published image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/opensac:${{ needs.metadata.outputs.version }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker pull "${IMAGE}"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "${IMAGE}")" = "${EXPECTED_VERSION}"
          docker run --rm --entrypoint python "${IMAGE}" -c "import opensac; assert opensac.__version__ == '${EXPECTED_VERSION}'"

  github-release:
    name: Create GitHub Release
    needs:
      - metadata
      - publish-sandbox
      - publish-service
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
